<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #0a0e1a; --bg-secondary: #131825; --bg-card: #1a2033;
    --border: #2a3348; --text-primary: #f1f5f9; --text-secondary: #94a3b8;
    --accent-1: #8b5cf6; --accent-2: #3b82f6; --success: #22c55e;
    --danger: #ef4444; --warning: #f59e0b;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-primary); color: var(--text-primary); padding-bottom: 70px;
    overflow-x: hidden; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .header {
    background: var(--bg-secondary); padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 1050;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .hamburger {
    background: transparent; border: none; color: var(--text-primary); font-size: 22px;
    cursor: pointer; display: flex; align-items: center; padding: 6px; border-radius: 8px; transition: background 0.2s;
  }
  .hamburger:hover { background: var(--bg-card); }
  .header-title {
    font-size: 18px; font-weight: 600; color: var(--text-primary); flex-grow: 1;
    letter-spacing: -0.3px; cursor: pointer; transition: opacity 0.2s;
  }
  .header-title:hover { opacity: 0.8; }
  .header-badge {
    font-size: 12px; color: var(--text-secondary); padding: 4px 10px;
    background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border);
  }
  .sidebar-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 900; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
  }
  .sidebar-overlay.active { opacity: 1; visibility: visible; }
  .sidebar {
    position: fixed; top: 0; left: -300px; width: 280px; height: 100vh;
    background: rgba(19,24,37,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border); z-index: 1100; padding: 24px 16px;
    display: flex; flex-direction: column; gap: 8px;
    transition: left 0.3s cubic-bezier(0.4,0,0.2,1); box-shadow: 4px 0 30px rgba(0,0,0,0.5);
  }
  .sidebar.open { left: 0; }
  .sidebar-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 20px; margin-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .sidebar-title { font-weight: 600; font-size: 15px; color: var(--text-primary); letter-spacing: -0.2px; }
  .close-btn {
    background: transparent; border: none; color: var(--text-secondary); font-size: 18px;
    cursor: pointer; padding: 6px; border-radius: 6px; transition: all 0.2s;
  }
  .close-btn:hover { background: var(--bg-card); color: var(--text-primary); }
  .tab-btn {
    background: transparent; color: var(--text-secondary); border: none;
    padding: 14px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
    text-align: left; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 12px; width: 100%;
  }
  .tab-btn:hover { background: var(--bg-card); color: var(--text-primary); }
  .tab-btn.active {
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(59,130,246,0.15));
    color: var(--text-primary); border: 1px solid rgba(139,92,246,0.3);
  }
  .tab-icon { width: 18px; height: 18px; stroke-width: 2; }
  .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .stats-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: var(--bg-card); padding: 24px; border-radius: 16px; border: 1px solid var(--border);
    position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: rgba(139,92,246,0.4); }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); opacity: 0.8;
  }
  .stat-card.traffic::before { background: linear-gradient(90deg, #8b5cf6, #3b82f6); }
  .stat-card.audience::before { background: linear-gradient(90deg, #06b6d4, #10b981); }
  .stat-card.monetization::before { background: linear-gradient(90deg, #f59e0b, #ef4444); }
  .stat-card.engagement::before { background: linear-gradient(90deg, #ec4899, #8b5cf6); }
  .stat-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
  .stat-value { font-size: 32px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; letter-spacing: -0.5px; }
  .stat-change { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; }
  .pos { background: rgba(34,197,94,0.15); color: var(--success); }
  .neutral { background: rgba(148,163,184,0.15); color: var(--text-secondary); }
  .section-title { font-size: 17px; margin: 28px 0 16px 0; color: var(--text-primary); font-weight: 600; letter-spacing: -0.3px; }
  .placeholder-box {
    background: var(--bg-card); border: 1px dashed var(--border); border-radius: 16px;
    padding: 48px 24px; text-align: center; color: var(--text-secondary); font-size: 14px;
  }
  .form-card { background: var(--bg-card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
  .form-group { display: flex; flex-direction: column; gap: 14px; }
  input, select {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg-primary); color: var(--text-primary); font-size: 14px; font-family: inherit; transition: border-color 0.2s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent-1); }
  input::placeholder { color: var(--text-secondary); }
  button.action-btn {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff; border: none;
    padding: 13px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer;
    width: 100%; transition: all 0.2s; font-family: inherit;
  }
  button.action-btn:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(139,92,246,0.3); }
  button.action-btn:active { transform: translateY(0); }
  .content-list { display: flex; flex-direction: column; gap: 12px; }
  .content-item {
    background: var(--bg-card); padding: 18px; border-radius: 12px; border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px; transition: border-color 0.2s;
  }
  .content-item:hover { border-color: rgba(139,92,246,0.3); }
  .content-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .content-title { font-weight: 600; font-size: 15px; color: var(--text-primary); letter-spacing: -0.2px; }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; }
  .badge.published { background: rgba(34,197,94,0.15); color: var(--success); }
  .badge.scheduled { background: rgba(245,158,11,0.15); color: var(--warning); }
  .badge.draft { background: rgba(148,163,184,0.15); color: var(--text-secondary); }
  .content-type { font-size: 13px; color: var(--accent-2); font-weight: 500; }
  .content-seo { font-size: 13px; color: var(--text-secondary); }
  .social-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .status-badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .status-connected { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
  .status-disconnected { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
  .oauth-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px; padding: 13px; border-radius: 10px;
    font-weight: 600; font-size: 14px; text-decoration: none; width: 100%; transition: all 0.2s;
    border: 1px solid var(--border); font-family: inherit;
  }
  .oauth-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.3); }
  .oauth-btn.youtube { background: #fff; color: #1f2937; border-color: #fff; }
  .oauth-btn.youtube:hover { background: #f9fafb; }
  .oauth-btn.twitch { background: #9146FF; color: #fff; border-color: #9146FF; }
  .oauth-btn.twitch:hover { background: #7c3aed; }
  .disconnect-btn { background: rgba(239,68,68,0.15) !important; color: var(--danger) !important; border: 1px solid rgba(239,68,68,0.3) !important; }
  .disconnect-btn:hover { background: rgba(239,68,68,0.25) !important; }
  .social-description { color: var(--text-secondary); font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="header">
  <button class="hamburger" id="hamburger-btn" aria-label="Open Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <h1 class="header-title" id="logo-btn">Creator Dashboard</h1>
  <span class="header-badge">Global</span>
</div>

<div class="sidebar-overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">Menu</span>
    <button class="close-btn" id="close-sidebar-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  <button class="tab-btn active" data-tab="overview">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    Overview
  </button>
  <button class="tab-btn" data-tab="contents">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
    Content
  </button>
  <button class="tab-btn" data-tab="settings">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    Settings
  </button>
</div>

<div class="container">
  <div id="tab-overview" class="tab-pane active">
    <h2 class="section-title" style="margin-top:0;">Global Stats</h2>
    <div id="stats-container" class="stats-grid"></div>
    <h2 class="section-title">Growth Trend</h2>
    <div class="placeholder-box"> Charts coming in the next update.</div>
  </div>

  <div id="tab-contents" class="tab-pane">
    <div class="form-card">
      <h2 class="section-title" style="margin-top:0;">Add Content</h2>
      <div class="form-group">
        <input type="text" id="cTitle" placeholder="Content title">
        <select id="cType">
          <option value="Video">YouTube Video</option>
          <option value="Post">Social Post</option>
          <option value="Live">Live Stream</option>
        </select>
        <select id="cStatus">
          <option value="Published">Published</option>
          <option value="Scheduled">Scheduled</option>
          <option value="Draft">Draft</option>
        </select>
        <input type="text" id="cTags" placeholder="Tags (e.g. gaming, tutorial)">
        <button class="action-btn" id="save-content-btn">Save Content</button>
      </div>
    </div>
    <h2 class="section-title">My Content</h2>
    <div id="contents-list" class="content-list"></div>
  </div>

  <div id="tab-settings" class="tab-pane">
    <h2 class="section-title" style="margin-top:0;">Social Integrations</h2>
    <p class="social-description">Connect your accounts to sync real-time data across all platforms.</p>
    <div id="social-integrations-list"></div>
  </div>
</div>
<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('active');
  }

  document.getElementById('hamburger-btn').addEventListener('click', toggleSidebar);
  document.getElementById('close-sidebar-btn').addEventListener('click', toggleSidebar);
  document.getElementById('overlay').addEventListener('click', toggleSidebar);

  document.getElementById('logo-btn').addEventListener('click', () => {
    document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-overview').classList.add('active');
    document.querySelector('[data-tab="overview"]').classList.add('active');
    loadStats();
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tabName = btn.getAttribute('data-tab');
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      btn.classList.add('active');
      toggleSidebar();
      if (tabName === 'overview') loadStats();
      if (tabName === 'contents') loadContents();
      if (tabName === 'settings') loadSettings();
    });
  });

  async function loadStats() {
    try {
      const response = await fetch('/api/overview');
      const data = await response.json();
      const container = document.getElementById('stats-container');
      container.innerHTML = '';
      if (!Array.isArray(data)) { container.innerHTML = '<div class="placeholder-box">Error loading stats.</div>'; return; }
      data.forEach(item => {
        const changeClass = item.change === 'Live' || item.change === 'Synced' ? 'pos' : 'neutral';
        const card = document.createElement('div');
        card.className = 'stat-card ' + (item.category || '');
        card.innerHTML = '<div class="stat-title">' + item.title + '</div><div class="stat-value">' + item.value + '</div><div class="stat-change ' + changeClass + '">' + item.change + '</div>';
        container.appendChild(card);
      });
    } catch (err) { document.getElementById('stats-container').innerHTML = '<div class="placeholder-box">Connection error.</div>'; }
  }

  async function loadContents() {
    try {
      const response = await fetch('/api/contents');
      const data = await response.json();
      const container = document.getElementById('contents-list');
      container.innerHTML = '';
      if (!Array.isArray(data) || data.length === 0) { container.innerHTML = '<div class="placeholder-box">No content yet.</div>'; return; }
      data.forEach(item => {
        const statusClass = item.status ? item.status.toLowerCase() : 'draft';
        const el = document.createElement('div');
        el.className = 'content-item';
        el.innerHTML = '<div class="content-header"><span class="content-title">' + item.title + '</span><span class="badge ' + statusClass + '">' + item.status + '</span></div><div class="content-type">' + item.type + '</div><div class="content-seo">Tags: ' + (item.seo_tags || 'None') + '</div>';
        container.appendChild(el);
      });
    } catch (err) { document.getElementById('contents-list').innerHTML = '<div class="placeholder-box">Connection error.</div>'; }
  }

  document.getElementById('save-content-btn').addEventListener('click', async () => {
    const title = document.getElementById('cTitle').value;
    const type = document.getElementById('cType').value;
    const status = document.getElementById('cStatus').value;
    const seo_tags = document.getElementById('cTags').value;
    if (!title.trim()) { alert('Please enter a title'); return; }
    try {
      const response = await fetch('/api/contents', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, type, status, seo_tags }) });
      const resData = await response.json();
      if (resData.success) { document.getElementById('cTitle').value = ''; document.getElementById('cTags').value = ''; loadContents(); } else { alert('Save error'); }
    } catch (err) { alert('Connection error'); }
  });
   async function loadSettings() {
    try {
      const response = await fetch('/api/settings/socials');
      const data = await response.json();
      const container = document.getElementById('social-integrations-list');
      container.innerHTML = '';
      data.forEach(item => {
        const isConn = item.is_connected === true || item.is_connected === 1 || item.is_connected === 'true';
        const statusText = isConn ? 'Connected' : 'Disconnected';
        const statusClass = isConn ? 'status-connected' : 'status-disconnected';
        const card = document.createElement('div');
        card.className = 'form-card';
        if (item.platform === 'YouTube' || item.platform === 'Twitch') {
          const isTwitch = item.platform === 'Twitch';
          const authUrl = isTwitch ? '/auth/twitch' : '/auth/google';
          const btnClass = isTwitch ? 'twitch' : 'youtube';
          const btnText = isTwitch ? 'Sign in with Twitch' : 'Sign in with Google';
          const twitchSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.64 5.93h1.43v4.28h-1.43m3.93-4.28H17v4.28h-1.43M7 2L3.43 5.57v12.86h4.28V22l3.58-3.57h2.85L20.57 12V2z"/></svg>';
          const googleSvg = '<svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-3.58-13.46-8.62l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
          const logoSvg = isTwitch ? twitchSvg : googleSvg;
          if (isConn) { card.innerHTML = '<div class="social-header"><strong>' + item.platform + '</strong><span class="status-badge ' + statusClass + '">' + statusText + '</span></div><p class="social-description">Official sync active.</p><button class="action-btn disconnect-btn" data-platform="' + item.platform + '">Disconnect</button>'; } 
          else { card.innerHTML = '<div class="social-header"><strong>' + item.platform + '</strong><span class="status-badge ' + statusClass + '">' + statusText + '</span></div><p class="social-description">Connect via official auth.</p><a href="' + authUrl + '" class="oauth-btn ' + btnClass + '">' + logoSvg + '<span>' + btnText + '</span></a>'; }
        } else {
          if (isConn) { card.innerHTML = '<div class="social-header"><strong>' + item.platform + '</strong><span class="status-badge ' + statusClass + '">' + statusText + '</span></div><p class="social-description">Account connected.</p><button class="action-btn disconnect-btn" data-platform="' + item.platform + '">Disconnect</button>'; } 
          else { card.innerHTML = '<div class="social-header"><strong>' + item.platform + '</strong><span class="status-badge ' + statusClass + '">' + statusText + '</span></div><div class="form-group"><input type="text" id="acc-' + item.platform + '" placeholder="Account ID / Username" value="' + (item.account_id || '') + '"><input type="password" id="key-' + item.platform + '" placeholder="API Key / Token" value="' + (item.api_key || '') + '"><button class="action-btn save-social-btn" data-platform="' + item.platform + '">Save ' + item.platform + '</button></div>'; }
        }
        container.appendChild(card);
      });
      document.querySelectorAll('.save-social-btn').forEach(btn => { btn.addEventListener('click', async () => { const p = btn.getAttribute('data-platform'); const a = document.getElementById('acc-' + p).value; const k = document.getElementById('key-' + p).value; try { const r = await fetch('/api/settings/socials', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ platform: p, account_id: a, api_key: k }) }); const d = await r.json(); if (d.success) { alert('Saved!'); loadSettings(); } else { alert('Error'); } } catch (e) { alert('Connection error'); } }); });
      document.querySelectorAll('.disconnect-btn').forEach(btn => { btn.addEventListener('click', async () => { const p = btn.getAttribute('data-platform'); try { const r = await fetch('/api/settings/disconnect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ platform: p }) }); const d = await r.json(); if (d.success) loadSettings(); else alert('Error'); } catch (e) { alert('Connection error'); } }); });
    } catch (err) { document.getElementById('social-integrations-list').innerHTML = '<div class="placeholder-box">Error loading settings.</div>'; }
  }

  loadStats();
  loadContents();

  setInterval(() => {
    if (document.getElementById('tab-overview').classList.contains('active')) {
      loadStats();
    }
  }, 30000);
</script>

</body>
</html>
