<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #0a0e1a; --bg-card: rgba(26, 32, 51, 0.5); --border: rgba(42, 51, 72, 0.5);
    --text-primary: #f1f5f9; --text-secondary: #94a3b8; --accent-1: #8b5cf6; --accent-2: #3b82f6;
    --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; position: relative; overflow-x: hidden;
  }
  .fluid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; background: #0a0e1a; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: float 20s infinite ease-in-out; }
  .blob-1 { width: 500px; height: 500px; background: #8b5cf6; top: -100px; left: -100px; }
  .blob-2 { width: 600px; height: 600px; background: #3b82f6; top: 40%; right: -150px; animation-delay: -5s; }
  .blob-3 { width: 450px; height: 450px; background: #06b6d4; bottom: -100px; left: 20%; animation-delay: -10s; }
  @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -50px) scale(1.1); } }
  
  .header { background: rgba(19,24,37,0.7); backdrop-filter: blur(20px); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  .hamburger { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; }
  .header-title { font-size: 18px; font-weight: 600; flex-grow: 1; cursor: pointer; }
  .header-badge { font-size: 12px; color: var(--text-secondary); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
  
  .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100vh; background: rgba(10,14,26,0.95); backdrop-filter: blur(30px); border-right: 1px solid var(--border); z-index: 200; padding: 24px; transition: left 0.3s ease; }
  .sidebar.open { left: 0; }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
  
  .tab-btn { background: none; border: none; color: var(--text-secondary); width: 100%; text-align: left; padding: 14px; font-size: 15px; cursor: pointer; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .tab-btn.active { background: rgba(139,92,246,0.15); color: var(--text-primary); border: 1px solid rgba(139,92,246,0.3); }
  
  .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  
  .stats-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 32px; }
  @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  
  .stat-card { background: var(--bg-card); backdrop-filter: blur(20px); padding: 24px; border-radius: 16px; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); }
  .stat-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .stat-value { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
  .stat-change { font-size: 13px; color: var(--success); font-weight: 600; }
  
  .form-card { background: var(--bg-card); backdrop-filter: blur(20px); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; }
  .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  
  input, select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text-primary); padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent-1); }
  
  .action-btn { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px; }
  
  .content-item { background: var(--bg-card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; font-weight: 600; }
  .badge.published { background: rgba(34,197,94,0.2); color: var(--success); }
  .badge.draft { background: rgba(148,163,184,0.2); color: var(--text-secondary); }
  
  .placeholder-box { text-align: center; padding: 40px; color: var(--text-secondary); border: 1px dashed var(--border); border-radius: 12px; }
  
  .social-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.on { background: var(--success); }
  .status-dot.off { background: var(--danger); }
</style>
</head>
<body>

<div class="fluid-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="header">
  <button class="hamburger" id="menu-btn">☰</button>
  <h1 class="header-title" id="logo-btn">Creator Dashboard</h1>
  <span class="header-badge">Live</span>
</div>

<div class="sidebar-overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <button class="tab-btn active" data-tab="overview">📊 Overview</button>
  <button class="tab-btn" data-tab="contents">📝 Content</button>
  <button class="tab-btn" data-tab="settings">️ Settings</button>
</div>

<div class="container">
   <div id="tab-overview" class="tab-pane active">
    <h2 class="section-title">Global Stats</h2>
    <div id="stats-container" class="stats-grid"></div>
    <h2 class="section-title">Growth</h2>
    <div class="placeholder-box">Charts coming soon.</div>
  </div>

  <div id="tab-contents" class="tab-pane">
    <div class="form-card">
      <h2 class="section-title">Add New Content</h2>
      <input type="text" id="cTitle" placeholder="Title">
      <select id="cType">
        <option value="Video">Video</option>
        <option value="Post">Post</option>
        <option value="Live">Live</option>
      </select>
      <select id="cStatus">
        <option value="Published">Published</option>
        <option value="Draft">Draft</option>
      </select>
      <input type="text" id="cTags" placeholder="Tags (comma separated)">
      <button class="action-btn" id="save-btn">Save Content</button>
    </div>
    <h2 class="section-title">My Content</h2>
    <div id="content-list"></div>
  </div>

  <div id="tab-settings" class="tab-pane">
    <h2 class="section-title">Integrations</h2>
    <div id="social-list"></div>
  </div>
</div>
<script>
  // Navigation
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  document.getElementById('menu-btn').onclick = () => { sidebar.classList.add('open'); overlay.classList.add('active'); };
  document.getElementById('overlay').onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); };
  document.getElementById('logo-btn').onclick = () => switchTab('overview');
  
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);
  });

  function switchTab(tabName) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
    if (tabName === 'overview') loadStats();
    if (tabName === 'contents') loadContents();
    if (tabName === 'settings') loadSettings();
  }

  // Real API Calls
  async function loadStats() {
    const container = document.getElementById('stats-container');
    container.innerHTML = '<div class="placeholder-box">Loading...</div>';
    try {
      const res = await fetch('/api/overview');
      const data = await res.json();
      container.innerHTML = '';
      data.forEach(item => {
        container.innerHTML += `
          <div class="stat-card">
            <div class="stat-title">${item.title}</div>
            <div class="stat-value">${item.value}</div>
            <div class="stat-change">${item.change}</div>
          </div>`;
      });
    } catch (e) { container.innerHTML = '<div class="placeholder-box">Error loading stats.</div>'; }
  }

  async function loadContents() {
    const container = document.getElementById('content-list');
    container.innerHTML = '<div class="placeholder-box">Loading...</div>';
    try {
      const res = await fetch('/api/contents');
      const data = await res.json();
      container.innerHTML = '';
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="placeholder-box">No content yet. Add your first one above!</div>';
        return;
      }
      data.forEach(item => {
        container.innerHTML += `
          <div class="content-item">
            <div>
              <div style="font-weight:600; margin-bottom:4px;">${item.title}</div>
              <div style="font-size:12px; color:var(--text-secondary);">${item.type} • ${item.seo_tags || 'No tags'}</div>
            </div>
            <span class="badge ${item.status.toLowerCase()}">${item.status}</span>
          </div>`;
      });
    } catch (e) { container.innerHTML = '<div class="placeholder-box">Error loading content.</div>'; }
  }

  document.getElementById('save-btn').onclick = async () => {
    const title = document.getElementById('cTitle').value;
    if (!title) return alert('Title is required');
    const body = {
      title: title,
      type: document.getElementById('cType').value,
      status: document.getElementById('cStatus').value,
      seo_tags: document.getElementById('cTags').value
    };
    try {
      await fetch('/api/contents', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
      document.getElementById('cTitle').value = '';
      document.getElementById('cTags').value = '';
      loadContents();
    } catch (e) { alert('Error saving'); }
  };

  async function loadSettings() {
    const container = document.getElementById('social-list');
    container.innerHTML = '<div class="placeholder-box">Loading...</div>';
    try {
      const res = await fetch('/api/settings/socials');
      const data = await res.json();
      container.innerHTML = '';
      data.forEach(item => {
        const isOn = item.is_connected;
        container.innerHTML += `
          <div class="social-card">
            <div>
              <strong>${item.platform}</strong>
              <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">
                <span class="status-dot ${isOn ? 'on' : 'off'}"></span> ${isOn ? 'Connected' : 'Disconnected'}
              </div>
            </div>
            ${isOn ? `<button class="action-btn" style="width:auto; padding:8px 16px; background:rgba(239,68,68,0.2); color:var(--danger);" onclick="disconnect('${item.platform}')">Disconnect</button>` : ''}
          </div>`;
      });
    } catch (e) { container.innerHTML = '<div class="placeholder-box">Error loading settings.</div>'; }
  }

  window.disconnect = async (platform) => {
    await fetch('/api/settings/disconnect', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({platform}) });
    loadSettings();
  };

  // Init
  loadStats();
</script>
</body>
</html>
