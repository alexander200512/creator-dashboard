<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: rgba(19, 24, 37, 0.6);
    --bg-card: rgba(26, 32, 51, 0.5);
    --border: rgba(42, 51, 72, 0.5);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --accent-1: #8b5cf6;
    --accent-2: #3b82f6;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    padding-bottom: 70px;
    overflow-x: hidden;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
  }
  .fluid-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; background: #0a0e1a;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: float 20s infinite ease-in-out;
  }
  .blob-1 { width: 500px; height: 500px; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); top: -100px; left: -100px; animation-delay: 0s; }
  .blob-2 { width: 600px; height: 600px; background: radial-gradient(circle, #3b82f6 0%, transparent 70%); top: 50%; right: -150px; animation-delay: -5s; }
  .blob-3 { width: 450px; height: 450px; background: radial-gradient(circle, #06b6d4 0%, transparent 70%); bottom: -100px; left: 30%; animation-delay: -10s; }
  .blob-4 { width: 400px; height: 400px; background: radial-gradient(circle, #ec4899 0%, transparent 70%); top: 30%; left: 20%; animation-delay: -15s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(50px, -30px) scale(1.1); }
    50% { transform: translate(-30px, 50px) scale(0.9); }
    75% { transform: translate(30px, 30px) scale(1.05); }
  }
  .header {
    background: var(--bg-secondary); padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 1050;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .hamburger {
    background: transparent; border: none; color: var(--text-primary); font-size: 22px;
    cursor: pointer; display: flex; align-items: center; padding: 6px; border-radius: 8px; transition: background 0.2s;
  }
  .hamburger:hover { background: rgba(255,255,255,0.1); }
  .header-title {
    font-size: 18px; font-weight: 600; color: var(--text-primary); flex-grow: 1;
    letter-spacing: -0.3px; cursor: pointer; transition: opacity 0.2s;
  }
  .header-title:hover { opacity: 0.8; }
  .header-badge {
    font-size: 12px; color: var(--text-secondary); padding: 4px 10px;
    background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid var(--border);
  }
  .sidebar-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 900; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
  }
  .sidebar-overlay.active { opacity: 1; visibility: visible; }
  .sidebar {
    position: fixed; top: 0; left: -300px; width: 280px; height: 100vh;
    background: rgba(19, 24, 37, 0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-right: 1px solid var(--border); z-index: 1100; padding: 24px 16px;
    display: flex; flex-direction: column; gap: 8px;
    transition: left 0.3s cubic-bezier(0.4,0,0.2,1); box-shadow: 4px 0 30px rgba(0,0,0,0.5);
  }
  .sidebar.open { left: 0; }
  .sidebar-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 20px; margin-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .sidebar-title { font-weight: 600; font-size: 15px; color: var(--text-primary); letter-spacing: -0.2px; }
  .close-btn {
    background: transparent; border: none; color: var(--text-secondary); font-size: 18px;
    cursor: pointer; padding: 6px; border-radius: 6px; transition: all 0.2s;
  }
  .close-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
  .tab-btn {
    background: transparent; color: var(--text-secondary); border: none;
    padding: 14px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
    text-align: left; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 12px; width: 100%;
  }
  .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
  .tab-btn.active {
    background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(59,130,246,0.2));
    color: var(--text-primary); border: 1px solid rgba(139,92,246,0.4); backdrop-filter: blur(10px);
  }
  .tab-icon { width: 18px; height: 18px; stroke-width: 2; }
  .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; position: relative; z-index: 1; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .stats-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: var(--bg-card); padding: 24px; border-radius: 16px; border: 1px solid var(--border);
    position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .stat-card:hover { transform: translateY(-2px); border-color: rgba(139,92,246,0.6); }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); opacity: 0.8;
  }
  .stat-card.traffic::before { background: linear-gradient(90deg, #8b5cf6, #3b82f6); }
  .stat-card.audience::before { background: linear-gradient(90deg, #06b6d4, #10b981); }
  .stat-card.monetization::before { background: linear-gradient(90deg, #f59e0b, #ef4444); }
  .stat-card.engagement::before { background: linear-gradient(90deg, #ec4899, #8b5cf6); }
  .stat-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
  .stat-value { font-size: 32px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; letter-spacing: -0.5px; }
  .stat-change { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; }
  .pos { background: rgba(34,197,94,0.2); color: var(--success); }
  .neutral { background: rgba(148,163,184,0.2); color: var(--text-secondary); }
  .section-title { font-size: 17px; margin: 28px 0 16px 0; color: var(--text-primary); font-weight: 600; letter-spacing: -0.3px; }
  .placeholder-box {
    background: var(--bg-card); border: 1px dashed var(--border); border-radius: 16px;
    padding: 48px 24px; text-align: center; color: var(--text-secondary); font-size: 14px; backdrop-filter: blur(20px);
  }
  .form-card {
    background: var(--bg-card); padding: 24px; border-radius: 16px; border: 1px solid var(--border);
    margin-bottom: 20px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .form-group { display: flex; flex-direction: column; gap: 14px; }
  input, select {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: rgba(10, 14, 26, 0.6); color: var(--text-primary); font-size: 14px; font-family: inherit; transition: border-color 0.2s; backdrop-filter: blur(10px);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent-1); background: rgba(10, 14, 26, 0.8); }
  input::placeholder { color: var(--text-secondary); }
  button.action-btn {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff; border: none;
    padding: 13px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer;
    width: 100%; transition: all 0.2s; font-family: inherit;
  }
  button.action-btn:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(139,92,246,0.4); }
  button.action-btn:active { transform: translateY(0); }
  .content-list { display: flex; flex-direction: column; gap: 12px; }
  .content-item {
    background: var(--bg-card); padding: 18px; border-radius: 12px; border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px; transition: border-color 0.2s; backdrop-filter: blur(20px);
  }
  .content-item:hover { border-color: rgba(139,92,246,0.5); }
  .content-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .content-title { font-weight: 600; font-size: 15px; color: var(--text-primary); letter-spacing: -0.2px; }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; }
  .badge.published { background: rgba(34,197,94,0.2); color: var(--success); }
  .badge.scheduled { background: rgba(245,158,11,0.2); color: var(--warning); }
  .badge.draft { background: rgba(148,163,184,0.2); color: var(--text-secondary); }
  .content-type { font-size: 13px; color: var(--accent-2); font-weight: 500; }
  .content-seo { font-size: 13px; color: var(--text-secondary); }
  .delete-btn {
    background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; align-self: flex-start;
  }
  .delete-btn:hover { background: rgba(239,68,68,0.25); }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; font-family: inherit; backdrop-filter: blur(10px);
  }
  .filter-btn:hover { color: var(--text-primary); border-color: rgba(139,92,246,0.4); }
  .filter-btn.active {
    background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(59,130,246,0.25));
    color: var(--text-primary); border-color: rgba(139,92,246,0.5);
  }
  .social-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .status-badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }

<body>

<div class="fluid-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>

<div class="header">
  <button class="hamburger" id="hamburger-btn" aria-label="Open Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <h1 class="header-title" id="logo-btn">Creator Dashboard</h1>
  <span class="header-badge">Global</span>
</div>

<div class="sidebar-overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">Menu</span>
    <button class="close-btn" id="close-sidebar-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  <button class="tab-btn active" data-tab="overview">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    Overview
  </button>
  <button class="tab-btn" data-tab="contents">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
    Content
  </button>
  <button class="tab-btn" data-tab="settings">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    Settings
  </button>
</div>

<div class="container">
  <div id="tab-overview" class="tab-pane active">
    <h2 class="section-title" style="margin-top:0;">Global Stats</h2>
    <div id="stats-container" class="stats-grid"></div>
    <h2 class="section-title">Growth Trend</h2>
    <div class="placeholder-box">Charts coming in the next update.</div>
  </div>

  <div id="tab-contents" class="tab-pane">
    <div class="form-card">
      <h2 class="section-title" style="margin-top:0;">Add Content</h2>
      <div class="form-group">
        <input type="text" id="cTitle" placeholder="Content title">
        <select id="cType">
          <option value="Video">YouTube Video</option>
          <option value="Post">Social Post</option>
          <option value="Live">Live Stream</option>
        </select>
        <select id="cStatus">
          <option value="Published">Published</option>
          <option value="Scheduled">Scheduled</option>
          <option value="Draft">Draft</option>
        </select>
        <input type="text" id="cTags" placeholder="Tags (e.g. gaming, tutorial)">
        <button class="action-btn" id="save-content-btn">Save Content</button>
      </div>
    </div>
    <h2 class="section-title">My Content</h2>
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Published">Published</button>
      <button class="filter-btn" data-filter="Scheduled">Scheduled</button>
      <button class="filter-btn" data-filter="Draft">Draft</button>
    </div>
    <div id="contents-list" class="content-list"></div>
  </div>

  <div id="tab-settings" class="tab-pane">
    <h2 class="section-title" style="margin-top:0;">Social Integrations</h2>
    <div id="social-integrations-list"></div>
  </div>
</div>
                                                                                                     <script>
  let mockContents = [
    { id: 1, title: 'My First Gaming Video', type: 'Video', status: 'Published', seo_tags: 'gaming, tutorial' },
    { id: 2, title: 'Weekly Stream Highlights', type: 'Live', status: 'Scheduled', seo_tags: 'stream, highlights' },
    { id: 3, title: 'Behind the Scenes', type: 'Post', status: 'Draft', seo_tags: 'vlog' }
  ];
  let currentFilter = 'all';

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('active');
  }

  document.getElementById('hamburger-btn').addEventListener('click', toggleSidebar);
  document.getElementById('close-sidebar-btn').addEventListener('click', toggleSidebar);
  document.getElementById('overlay').addEventListener('click', toggleSidebar);

  document.getElementById('logo-btn').addEventListener('click', () => {
    document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-overview').classList.add('active');
    document.querySelector('[data-tab="overview"]').classList.add('active');
    loadStats();
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tabName = btn.getAttribute('data-tab');
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      btn.classList.add('active');
      toggleSidebar();
      if (tabName === 'overview') loadStats();
      if (tabName === 'contents') loadContents();
      if (tabName === 'settings') loadSettings();
    });
  });

  async function loadStats() {
    const stats = [
      { title: 'Total Views', value: '142,500', change: 'Live', category: 'traffic' },
      { title: 'Total Followers', value: '1,280', change: 'Live', category: 'audience' },
      { title: 'Active Platforms', value: '1', change: 'Synced', category: 'engagement' },
      { title: 'Content Pieces', value: mockContents.length.toString(), change: 'Add more', category: 'monetization' }
    ];
    const container = document.getElementById('stats-container');
    container.innerHTML = '';
    stats.forEach(item => {
      const changeClass = item.change === 'Live' || item.change === 'Synced' ? 'pos' : 'neutral';
      const card = document.createElement('div');
      card.className = 'stat-card ' + (item.category || '');
      card.innerHTML = '<div class="stat-title">' + item.title + '</div><div class="stat-value">' + item.value + '</div><div class="stat-change ' + changeClass + '">' + item.change + '</div>';
      container.appendChild(card);
    });
  }

  async function loadContents() {
    const container = document.getElementById('contents-list');
    container.innerHTML = '';
    const filtered = currentFilter === 'all' ? mockContents : mockContents.filter(c => c.status === currentFilter);
    if (filtered.length === 0) { container.innerHTML = '<div class="placeholder-box">No content found.</div>'; return; }
    filtered.forEach(item => {
      const statusClass = item.status ? item.status.toLowerCase() : 'draft';
      const el = document.createElement('div');
      el.className = 'content-item';
      el.innerHTML = '<div class="content-header"><span class="content-title">' + item.title + '</span><span class="badge ' + statusClass + '">' + item.status + '</span></div><div class="content-type">' + item.type + '</div><div class="content-seo">Tags: ' + (item.seo_tags || 'None') + '</div><button class="delete-btn" data-id="' + item.id + '">Delete</button>';
      container.appendChild(el);
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.getAttribute('data-id'));
        mockContents = mockContents.filter(c => c.id !== id);
        loadContents();
        loadStats();
      });
    });
  }

  document.getElementById('save-content-btn').addEventListener('click', () => {
    const title = document.getElementById('cTitle').value;
    const type = document.getElementById('cType').value;
    const status = document.getElementById('cStatus').value;
    const seo_tags = document.getElementById('cTags').value;
    if (!title.trim()) { alert('Please enter a title'); return; }
    const newId = mockContents.length > 0 ? Math.max(...mockContents.map(c => c.id)) + 1 : 1;
    mockContents.push({ id: newId, title, type, status, seo_tags });
    document.getElementById('cTitle').value = '';
    document.getElementById('cTags').value = '';
    loadContents();
    loadStats();
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter');
      loadContents();
    });
  });

  async function loadSettings() {
    const socials = [
      { platform: 'YouTube', is_connected: true, account_id: 'User', api_key: 'token' },
      { platform: 'Twitch', is_connected: false, account_id: '', api_key: '' },
      { platform: 'Instagram', is_connected: false, account_id: '', api_key: '' },
      { platform: 'TikTok', is_connected: false, account_id: '', api_key: '' }
    ];
    const container = document.getElementById('social-integrations-list');
    container.innerHTML = '';
    socials.forEach(item => {
      const isConn = item.is_connected;
      const statusText = isConn ? 'Connected' : 'Disconnected';
      const statusClass = isConn ? 'status-connected' : 'status-disconnected';
      const card = document.createElement('div');
      card.className = 'form-card';
      if (item.platform === 'YouTube' || item.platform === 'Twitch') {
        const isTwitch = item.platform === 'Twitch';
        const authUrl = isTwitch ? '/auth/twitch' : '/auth/google';
        const btnClass = isTwitch ? 'twitch' : 'youtube';
        const btnText = isTwitch ? 'Sign in with Twitch' : 'Sign in with Google';
        const twitchSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.64 5.93h1.43v4.28h-1.43m3.93-4.28H17v4.28h-1.43M7 2L3.43 5.57v12.86h4.28V22l3.58-3.57h2.85L20.57 12V2z"/></svg>';
