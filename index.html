<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
          background: #0f172a; 
          color: #f8fafc; 
          padding-bottom: 70px;
          overflow-x: hidden;
        }
        .header {
          background: #1e293b;
          padding: 16px 20px;
          border-bottom: 1px solid #334155;
          display: flex;
          align-items: center;
          gap: 16px;
          position: sticky;
          top: 0;
          z-index: 1050;
        }
        .hamburger {
          background: transparent;
          border: none;
          color: #f8fafc;
          font-size: 24px;
          cursor: pointer;
          display: flex;
          align-items: center;
          padding: 4px;
        }
        .header h1 { font-size: 18px; color: #38bdf8; flex-grow: 1; }
        .header-badge { font-size: 13px; color: #94a3b8; }
        
        .sidebar-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.6);
          backdrop-filter: blur(2px);
          z-index: 900;
          opacity: 0;
          visibility: hidden;
          transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active {
          opacity: 1;
          visibility: visible;
        }
        .sidebar {
          position: fixed;
          top: 0;
          left: -280px;
          width: 260px;
          height: 100vh;
          background: #1e293b;
          border-right: 1px solid #334155;
          z-index: 1100;
          padding: 20px 16px;
          display: flex;
          flex-direction: column;
          gap: 8px;
          transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          box-shadow: 4px 0 24px rgba(0,0,0,0.5);
        }
        .sidebar.open { left: 0; }
        .sidebar-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-bottom: 16px;
          margin-bottom: 12px;
          border-bottom: 1px solid #334155;
        }
        .sidebar-title { font-weight: bold; font-size: 16px; color: #38bdf8; }
        .close-btn { background: transparent; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 4px; }
        
        .tab-btn {
          background: transparent;
          color: #cbd5e1;
          border: none;
          padding: 14px 16px;
          border-radius: 10px;
          font-size: 15px;
          font-weight: 600;
          text-align: left;
          cursor: pointer;
          transition: all 0.2s;
          display: flex;
          align-items: center;
          gap: 12px;
          width: 100%;
        }
        .tab-btn:hover { background: #334155; }
        .tab-btn.active { background: #0284c7; color: #fff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        .kpi-grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: 16px;
          margin-bottom: 24px;
        }
        .kpi-card {
          background: #1e293b;
          padding: 20px;
          border-radius: 12px;
          border: 1px solid #334155;
          box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .kpi-title { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        .kpi-value { font-size: 28px; font-weight: bold; color: #f8fafc; margin-bottom: 8px; }
        .kpi-change { font-size: 13px; font-weight: 600; display: inline-block; padding: 4px 8px; border-radius: 6px; }
        .pos { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .neutral { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
        
        .section-title { font-size: 18px; margin: 20px 0 12px 0; color: #e2e8f0; }
        .placeholder-box {
          background: #1e293b;
          border: 2px dashed #334155;
          border-radius: 12px;
          padding: 40px 20px;
          text-align: center;
          color: #64748b;
        }
        .form-card {
          background: #1e293b;
          padding: 20px;
          border-radius: 12px;
          border: 1px solid #334155;
          margin-bottom: 16px;
        }
        .form-group { display: flex; flex-direction: column; gap: 12px; }
        input, select {
          width: 100%;
          padding: 12px;
          border-radius: 8px;
          border: 1px solid #475569;
          background: #0f172a;
          color: #fff;
          font-size: 14px;
        }
        button.action-btn {
          background: #38bdf8;
          color: #0f172a;
          border: none;
          padding: 12px;
          border-radius: 8px;
          font-weight: bold;
          font-size: 15px;
          cursor: pointer;
          width: 100%;
        }
        button.action-btn:hover { background: #0ea5e9; }
        
        .content-list { display: flex; flex-direction: column; gap: 12px; }
        .content-item {
          background: #1e293b;
          padding: 16px;
          border-radius: 10px;
          border: 1px solid #334155;
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .content-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .content-title { font-weight: bold; font-size: 16px; color: #fff; }
        .badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: 600; text-transform: uppercase; }
        .badge.published { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge.scheduled { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .badge.draft { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
        .content-seo { font-size: 13px; color: #94a3b8; }
        
        .social-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .status-connected { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .status-disconnected { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        
        .google-signin-btn {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: #ffffff;
          color: #1f2937;
          border: 1px solid #d1d5db;
          padding: 12px;
          border-radius: 8px;
          font-weight: 600;
          font-size: 15px;
          text-decoration: none;
          width: 100%;
          box-shadow: 0 1px 2px rgba(0,0,0,0.05);
          transition: background 0.2s;
        }
        .google-signin-btn:hover { background: #f9fafb; }
    </style>
</head>
<body>
    <div class="header">
        <button class="hamburger" id="hamburger-btn" aria-label="Open Menu">☰</button>
        <h1>Creator Dashboard</h1>
        <span class="header-badge">Welcome!</span>
    </div>

    <div class="sidebar-overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Navigation Menu</span>
            <button class="close-btn" id="close-sidebar-btn">✕</button>
        </div>
        <button class="tab-btn active" data-tab="overview">📊 1. Overview</button>
        <button class="tab-btn" data-tab="contents">📝 2. Contents</button>
        <button class="tab-btn" data-tab="settings">⚙️ 3. Settings (API)</button>
    </div>

    <div class="container">
        <div id="tab-overview" class="tab-pane active">
            <h2 class="section-title" style="margin-top:0;">Main KPIs (Real-Time)</h2>
            <div id="kpi-container" class="kpi-grid"></div>
            <h2 class="section-title">Previous Period Trend</h2>
            <div class="placeholder-box">
                📈 Growth chart (Views and Revenue) will be inserted here in the next step.
            </div>
        </div>

        <div id="tab-contents" class="tab-pane">
            <div class="form-card">
                <h2 class="section-title" style="margin-top:0;">⚡ Add Content</h2>
                <div class="form-group">
                    <input type="text" id="cTitle" placeholder="Content Title">
                    <select id="cType">
                        <option value="Video">YouTube Video</option>
                        <option value="Post">Social Post</option>
                        <option value="Live">Live Stream</option>
                    </select>
                    <select id="cStatus">
                        <option value="Published">Published</option>
                        <option value="Scheduled">Scheduled</option>
                        <option value="Draft">Draft</option>
                    </select>
                    <input type="text" id="cTags" placeholder="SEO Tags (e.g., gaming, tutorial)">
                    <button class="action-btn" id="save-content-btn">+ Save Content</button>
                </div>
            </div>
            <h2 class="section-title">My Contents</h2>
            <div id="contents-list" class="content-list"></div>
        </div>

        <div id="tab-settings" class="tab-pane">
            <h2 class="section-title" style="margin-top:0;">🔗 Social API Integrations</h2>
            <p style="color:#94a3b8; font-size:14px; margin-bottom:20px;">
                Connect your accounts to synchronize data and real-time metrics.
            </p>
            <div id="social-integrations-list"></div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        document.getElementById('hamburger-btn').addEventListener('click', toggleSidebar);
        document.getElementById('close-sidebar-btn').addEventListener('click', toggleSidebar);
        document.getElementById('overlay').addEventListener('click', toggleSidebar);

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tabName = btn.getAttribute('data-tab');
                
                document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                
                document.getElementById('tab-' + tabName).classList.add('active');
                btn.classList.add('active');
                
                toggleSidebar();
                
                if (tabName === 'overview') loadOverview();
                if (tabName === 'contents') loadContents();
                if (tabName === 'settings') loadSettings();
            });
        });

        async function loadOverview() {
            try {
                const response = await fetch('/api/overview');
                const data = await response.json();
                const container = document.getElementById('kpi-container');
                container.innerHTML = '';
                if (!Array.isArray(data)) {
                    container.innerHTML = '<div class="placeholder-box">Error loading metrics.</div>';
                    return;
                }
                data.forEach(item => {
                    const isMasked = item.value === '--';
                    const changeClass = isMasked ? 'neutral' : 'pos';
                    container.innerHTML += 
                      '<div class="kpi-card">' +
                          '<div class="kpi-title">' + item.title + '</div>' +
                          '<div class="kpi-value">' + item.value + '</div>' +
                          '<div class="kpi-change ' + changeClass + '">' + item.change_percentage + '</div>' +
                      '</div>';
                });
            } catch (err) {
                document.getElementById('kpi-container').innerText = 'Connection error.';
            }
        }

        async function loadContents() {
            try {
                const response = await fetch('/api/contents');
                const data = await response.json();
                const container = document.getElementById('contents-list');
                container.innerHTML = '';
                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div class="placeholder-box">No content added yet.</div>';
                    return;
                }
                data.forEach(item => {
                    const statusClass = item.status ? item.status.toLowerCase() : 'draft';
                    container.innerHTML += 
                      '<div class="content-item">' +
                          '<div class="content-header">' +
                              '<span class="content-title">' + item.title + '</span>' +
                              '<span class="badge ' + statusClass + '">' + item.status + '</span>' +
                          '</div>' +
                          '<div style="font-size: 13px; color: #38bdf8;">Type: ' + item.type + '</div>' +
                          '<div class="content-seo">🏷️ Tags: ' + (item.seo_tags || 'None') + '</div>' +
                      '</div>';
                });
            } catch (err) {
                document.getElementById('contents-list').innerText = 'Error loading contents.';
            }
        }

        document.getElementById('save-content-btn').addEventListener('click', async () => {
            const title = document.getElementById('cTitle').value;
            const type = document.getElementById('cType').value;
            const status = document.getElementById('cStatus').value;
            const seo_tags = document.getElementById('cTags').value;
            if (!title.trim()) { alert('Please enter a valid title'); return; }
            try {
                const response = await fetch('/api/contents', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, type, status, seo_tags })
                });
                const resData = await response.json();
                if (resData.success) {
                    document.getElementById('cTitle').value = '';
                    document.getElementById('cTags').value = '';
                    loadContents();
                } else { alert('Save error'); }
            } catch (err) { alert('Connection error'); }
        });

        async function loadSettings() {
            try {
                const response = await fetch('/api/settings/socials');
                const data = await response.json();
                const container = document.getElementById('social-integrations-list');
                container.innerHTML = '';
                
                data.forEach(item => {
                    const isConn = item.is_connected === true || item.is_connected === 1 || item.is_connected === 'true';
                    const statusText = isConn ? 'Connected' : 'Disconnected';
                    const statusClass = isConn ? 'status-connected' : 'status-disconnected';
                    
                    const card = document.createElement('div');
                    card.className = 'form-card';

                    if (item.platform === 'YouTube') {
                        const googleLogoSvg = '<svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-3.58-13.46-8.62l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>';
                        
                        if (isConn) {
                            card.innerHTML = 
                              '<div class="social-header"><strong>YouTube</strong><span class="status-badge ' + statusClass + '">' + statusText + '</span></div>' +
                              '<p style="color:#94a3b8; font-size:13px; margin-bottom:12px;">Official Google synchronization active.</p>' +
                              '<button class="action-btn disconnect-btn" data-platform="YouTube" style="background: #ef4444; color: #fff;">Disconnect</button>';
                        } else {
                            card.innerHTML = 
                              '<div class="social-header"><strong>YouTube</strong><span class="status-badge ' + statusClass + '">' + statusText + '</span></div>' +
                              '<p style="color:#94a3b8; font-size:13px; margin-bottom:12px;">Connect channel via official Google authentication.</p>' +
                              '<a href="/auth/google" class="google-signin-btn">' + googleLogoSvg + '<span>Sign in with Google</span></a>';
                        }
                    } else {
                        // Colori brand specifici per le altre piattaforme (Twitch: viola, Instagram: gradiente rosa/arancio, TikTok: nero/grigio scuro)
                        let brandBg = '#38bdf8';
                        if (item.platform === 'Twitch') brandBg = '#9146FF';
                        else if (item.platform === 'Instagram') brandBg = 'linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888)';
                        else if (item.platform === 'TikTok') brandBg = '#010101';

                        if (isConn) {
                            card.innerHTML = 
                              '<div class="social-header"><strong>' + item.platform + '</strong><span class="status-badge ' + statusClass + '">' + statusText + '</span></div>' +
                              '<p style="color:#94a3b8; font-size:13px; margin-bottom:12px;">Account connected successfully.</p>' +
                              '<button class="action-btn disconnect-btn" data-platform="' + item.platform + '" style="background: #ef4444; color: #fff;">Disconnect</button>';
                        } else {
                            card.innerHTML = 
                              '<div class="social-header"><strong>' + item.platform + '</strong><span class="status-badge ' + statusClass + '">' + statusText + '</span></div>' +
                              '<div class="form-group">' +
                                  '<input type="text" id="acc-' + item.platform + '" placeholder="Account ID / Username" value="' + (item.account_id || '') + '">' +
                                  '<input type="password" id="key-' + item.platform + '" placeholder="API Key / Access Token" value="' + (item.api_key || '') + '">' +
                                  '<button class="action-btn save-social-btn" data-platform="' + item.platform + '" style="background: ' + brandBg + '; color: #fff;">Save ' + item.platform + '</button>' +
                              '</div>';
                        }
                    }
                    container.appendChild(card);
